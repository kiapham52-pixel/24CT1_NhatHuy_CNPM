<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }} - MusicStore</title>

    <style>
        body {
            font-family: Arial;
            background: #f8f7fc;
            margin: 0;
        }

        .container {
            width: 80%;
            margin: 60px auto;
            display: flex;
            gap: 50px;
            background: white;
            padding: 40px;
            border-radius: 15px;
        }

        .product-image {
            width: 50%;
        }

        .product-image img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 15px;
        }

        .product-info {
            flex: 1;
        }

        h1 {
            color: #5b2c83;
        }

        .price {
            color: #e74c3c;
            font-size: 28px;
            font-weight: bold;
        }

        .buy {
            background: #5b2c83;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #5b2c83;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="product-image">
        <img src="{{ product.image }}" alt="{{ product.name }}">
    </div>

    <div class="product-info">

        <h1>{{ product.name }}</h1>

        <p>Danh mục: {{ product.category }}</p>

        <p class="price">
            {{ product.price }} VNĐ
        </p>

        <p>{{ product.description }}</p>

        <p>
            Còn lại: {{ product.quantity }} sản phẩm
        </p>

        <a href="{% url 'add_to_cart' product.id %}">
    <button class="buy">
        🛒 Thêm vào giỏ hàng
    </button>
</a>

        <br>

        <a class="back" href="/">
            ← Quay lại trang chủ
        </a>

    </div>

</div>

</body>
</html>
